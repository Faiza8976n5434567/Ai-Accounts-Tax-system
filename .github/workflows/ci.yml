# Quality gates (PLAN.md §3). Runs on every push and pull request.
# G-6 (database tests on a temporary Supabase) and G-7 (advisors) are added in Phase 1.
name: CI

on:
  push:
    branches: [main, faizan]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    working-directory: poc

jobs:
  checks:
    name: Type check · lint · finance lint · unit tests · build · bundle scan · audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: poc/package-lock.json
      - run: npm ci
      - name: G-1 Type check
        run: npm run typecheck
      - name: G-2 Lint
        run: npm run lint
      - name: G-3 Finance lint
        run: npm run check:finance
      - name: G-5 Unit tests (≥ 95% line coverage on tax & ledger code)
        run: npm test
      - name: G-4 Build
        run: npx vite build
      - name: G-4 No secrets in the built site
        run: npm run check:bundle
      - name: G-8 Dependency audit (high and critical)
        run: npm audit --audit-level=high --omit=dev

  secrets:
    name: G-8 Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  e2e:
    name: G-9 End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: poc/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx vite build
      - run: npm run e2e
        env:
          CI: "true"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: poc/test-results
          retention-days: 7
